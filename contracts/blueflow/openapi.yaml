      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: category__icontains
        schema:
          type: string
      - in: query
        name: date_range
        schema:
          type: string
          format: date-time
          enum:
          - month
          - today
          - week
          - year
          - yesterday
        description: '* `today` - Today

          * `yesterday` - Yesterday

          * `week` - Past 7 days

          * `month` - This month

          * `year` - This year'
