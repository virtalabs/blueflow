  /api/network/topology/:
    get:
      operationId: getTopologySnapshot
      tags:
      - topology
      summary: Get the current topology snapshot.
      description: 'Returns the latest topology snapshot.


        Filter with `cidr` entries and `network` to scope to specific segments.

        An asset matches if any interface IP falls in a supplied CIDR. Multiple CIDRs
        are unioned.

        `edge_scope` governs boundary-crossing connections.

        '
      parameters:
      - name: cidr
        in: query
        required: false
        style: form
        explode: true
        description: Restrict to assets with an interface IP in this CIDR. Repeatable.
        schema:
          type: array
          items:
            type: string
            description: IPv4 or IPv6 CIDR block.
        examples:
          single:
            summary: One segment
            value:
            - 10.10.1.0/24
          multiple:
            summary: Two segments (union)
            value:
            - 10.10.0.0/24
            - 10.10.1.0/24
      - name: network
        in: query
        required: false
        description: Named network whose CIDRs are added to the query.
