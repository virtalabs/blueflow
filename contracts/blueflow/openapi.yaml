  /api/assets/bulk_update/:
    patch:
      operationId: assets_bulk_update_partial_update
      description: "Perform partial updates on multiple assets in a single request.\n\
        \nAccepts a list of partial asset payloads. Each item must include an\n``id``\
        \ field identifying the asset to update. Only the fields provided\nare modified;\
        \ all other fields are left unchanged.\n\nReturns a list of updated asset\
        \ objects. If any ``id`` is not found a\n404 response is returned immediately.\n\
        \nExample request body::\n\n    [\n        {\"id\": 1, \"hostname\": \"device-a.local\"\
        },\n        {\"id\": 2, \"ip_address\": \"10.0.0.5\", \"os\": \"Linux\"}\n\
        \    ]"
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
