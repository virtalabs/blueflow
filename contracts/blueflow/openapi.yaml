          description: Short Description For This Task
          maxLength: 200
        task:
          type: string
          title: Task Name
          description: 'The Name of the Celery Task that Should be Run.  (Example:
            "proj.tasks.import_contacts")'
          maxLength: 200
        args:
          type: string
          title: Positional Arguments
          description: 'JSON encoded positional arguments (Example: ["arg1", "arg2"])'
        kwargs:
          type: string
          title: Keyword Arguments
          description: 'JSON encoded keyword arguments (Example: {"argument": "value"})'
        queue:
