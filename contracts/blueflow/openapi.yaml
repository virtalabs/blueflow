    ViperWebhook:
      type: object
      description: Serializer for the Viper webhook.
      properties:
        callback:
          type: string
        since:
          type: string
          format: date-time
        before:
          type: string
          format: date-time
        max_pages:
          type: integer
        page_size:
          type: integer
      required:
      - callback
      - max_pages
      - page_size
      - since
    ViperWebhookResponseSerilizer:
      type: object
      properties:
        request_id:
          type: string
      required:
      - request_id
    TopologySnapshot:
      type: object
      description: Root topology snapshot envelope.
      additionalProperties: false
      required:
      - schema_version
      - snapshot_id
      - timestamp
      - assets
      properties:
        schema_version:
          const: 0.1.0-minimal
          description: Contract version. Fixed for this schema revision.
        snapshot_id:
          type: string
          format: uuid
          description: Opaque identifier for this snapshot instance.
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 time the snapshot was generated (UTC).
        assets:
          type: array
          description: Devices observed on the network. May be empty.
          items:
            $ref: '#/components/schemas/Asset'
        connections:
          type: array
          description: Directed traffic flows between assets (flat edge list).
          items:
            $ref: '#/components/schemas/Connection'
        external_endpoints:
          type: array
          description: Off-inventory peers (no BlueFlow asset) referenced by a connection
            IP.
          items:
            $ref: '#/components/schemas/ExternalEndpoint'
        query:
          description: Echo of the applied CIDR filter.
          oneOf:
          - $ref: '#/components/schemas/TopologyQuery'
          - type: 'null'
        networks:
          type: array
          description: Per-CIDR rollup.
          items:
            $ref: '#/components/schemas/NetworkSummary'
    Asset:
      type: object
      description: A device observed on the network.
      additionalProperties: false
      required:
      - id
      - interfaces
      properties:
        id:
          type: integer
          description: BlueFlow asset id (`Asset.id`).
          examples:
          - 4214
        hostname:
          type:
          - string
          - 'null'
          description: Asset hostname; may be null.
          examples:
          - PHILIPS-PACS-01
        manufacturer:
          type:
          - string
          - 'null'
          description: Hardware/software vendor.
          examples:
          - philips
        model:
          type:
          - string
          - 'null'
          description: Product name/model.
          examples:
          - intellispace_pacs
        category:
          type:
          - string
          - 'null'
          description: Semantic device role.
          examples:
          - pacs_server
        app_sw_version:
          type:
          - string
          - 'null'
          description: Firmware/software version.
          examples:
          - 4.4.6
        interfaces:
          type: array
          minItems: 1
          description: Network interfaces (NICs) on the device.
          items:
            $ref: '#/components/schemas/Interface'
        services:
          type: array
          description: Listening (open) services observed on the device.
          items:
            $ref: '#/components/schemas/Service'
        matched_cidrs:
          type: array
          description: Queried CIDRs containing one of this asset's interface IPs.
          items:
            type: string
        in_scope:
          type: boolean
          default: true
          description: false for boundary assets outside the queried CIDRs.
    Interface:
      type: object
      description: A network interface observed on a device.
      additionalProperties: false
      properties:
        mac_address:
          type:
          - string
          - 'null'
          pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
          description: MAC address.
          examples:
          - 00:1a:b1:10:01:41
        ipv4_address:
          type:
          - string
          - 'null'
          format: ipv4
          examples:
          - 10.10.1.41
        ipv6_address:
          type:
          - string
          - 'null'
          format: ipv6
          examples:
          - null
    Service:
      type: object
      description: A port/protocol pair observed listening on an asset.
      additionalProperties: false
      required:
      - port
      - protocol
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          examples:
          - 104
        protocol:
          type: string
          examples:
          - tcp
        cast:
          type: string
          enum:
          - unicast
          - multicast
          - broadcast
          default: unicast
          description: Service addressing model. Non-unicast does not appear in `connections`.
        service:
          type:
          - string
          - 'null'
          description: Resolved logical service name; null when unknown.
          examples:
          - dicom
    Connection:
      type: object
      description: A directed flow between interfaces, initiator to listening endpoint
        (`src_ip` → `dst_ip:dst_port`).
      additionalProperties: false
      required:
      - src_ip
      - dst_ip
      - dst_port
      - protocol
      properties:
        src_ip:
          type: string
          description: Initiating interface IP.
          examples:
          - 10.10.1.31
        dst_ip:
          type: string
          description: Destination interface IP. Resolves to an asset interface or
            an `external_endpoints` entry.
          examples:
          - 10.10.1.41
        dst_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Destination (listening) port on `dst_ip`.
          examples:
          - 104
        protocol:
          type: string
          examples:
          - tcp
        response_observed:
          type:
          - boolean
          - 'null'
          description: Whether return traffic was observed; null when unknown.
        service:
          type:
          - string
          - 'null'
          description: Resolved logical service name for `dst_port`; null when unknown.
          examples:
          - dicom
    ExternalEndpoint:
      type: object
      description: An off-inventory peer (no BlueFlow asset) seen as a connection
        endpoint.
      additionalProperties: false
      required:
      - ip_address
      properties:
        ip_address:
          type: string
          description: IP of the off-inventory peer.
          examples:
          - 203.0.113.10
        hostname:
          type:
          - string
          - 'null'
          description: Reverse-DNS or otherwise resolved name; null when unknown.
          examples:
          - null
    EdgeScope:
      type: string
      default: boundary
      enum:
      - internal
      - boundary
      description: 'Connections to include when filtering: `internal` (both endpoints
        in

        scope) or `boundary` (also one-endpoint edges; default).

        '
    TopologyQuery:
      type: object
      description: Echo of the applied filter.
      additionalProperties: false
      properties:
        cidrs:
          type: array
          description: CIDRs applied (normalized).
          items:
            type: string
        edge_scope:
          $ref: '#/components/schemas/EdgeScope'
    NetworkSummary:
      type: object
      description: Per-CIDR rollup for a filtered snapshot.
      additionalProperties: false
      required:
      - cidr
      properties:
        cidr:
          type: string
          description: One queried CIDR (normalized).
        asset_count:
          type: integer
          minimum: 0
          description: In-scope assets with an interface in this CIDR.
        connection_count:
          type: integer
          minimum: 0
          description: Connections with at least one endpoint in this CIDR.
    Error:
      type: object
      description: Standard DRF error envelope.
      properties:
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: topology
  description: Network topology snapshots.
