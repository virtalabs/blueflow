            $ref: '#/components/schemas/PeriodicTask'
    PatchedAssetRequest:
      type: object
      description: Serializes assets.
      properties:
        id:
          type: integer
          readOnly: true
        last_updated:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        usage:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties:
              type: integer
              minimum: 0
          example:
          - '9': 1
            '10': 12
            '11': 8
            '14': 3
            '15': 5
          - '9': 1
            '10': 8
            '11': 15
          - '9': 2
            '14': 5
          - '10': 6
            '11': 9
            '13': 4
          - '9': 1
            '13': 2
          - {}
          - {}
          readOnly: true
          description: 'Usage pattern: 7-element array of hour-of-day to observation-count
            maps. Index is 0-based with Monday first — 0=Monday, 1=Tuesday, 2=Wednesday,
            3=Thursday, 4=Friday, 5=Saturday, 6=Sunday. Hour keys are JSON-string-coerced
            integers 0-23; counts are non-negative; hours with zero observations are
            omitted from the response.'
        manufacturer:
          type: string
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 126
        hostname:
          type:
          - string
          - 'null'
          maxLength: 256
        oui_manufacturer:
          type: string
          readOnly: true
          title: NIC vendor
        model:
          type: string
          maxLength: 256
        serial_number:
          type: string
          maxLength: 256
        udi:
          type: string
          maxLength: 256
        tag_number:
          type: string
          maxLength: 256
        category:
          type: string
          maxLength: 256
        owner:
          type: string
          maxLength: 256
        os:
          type: string
          title: Operating System
          maxLength: 256
        app_sw_version:
          type: string
          title: Application software version
          maxLength: 256
        last_scanned:
          type: string
          format: date-time
        last_pinged:
          type: string
          format: date-time
        external_keys:
          oneOf:
          - {}
          - type: 'null'
        groups:
          type: array
          items:
            type: integer
          readOnly: true
        tags:
          type: array
          items:
            type: integer
          readOnly: true
    PatchedCrontabSchedule:
      type: object
      description: 'Serializer.


        Teaches the rest_framework (the ViewSet) which fields to expect.'
      properties:
        id:
          type: integer
          readOnly: true
        minute:
          type: string
          title: Minute(s)
          description: 'Cron Minutes to Run. Use "*" for "all". (Example: "0,30")'
          maxLength: 240
        hour:
          type: string
          title: Hour(s)
          description: 'Cron Hours to Run. Use "*" for "all". (Example: "8,20")'
          maxLength: 96
        day_of_week:
          type: string
          title: Day(s) Of The Week
          description: 'Cron Days Of The Week to Run. Use "*" for "all", Sunday is
            0 or 7, Monday is 1. (Example: "0,5")'
          maxLength: 64
        day_of_month:
          type: string
          title: Day(s) Of The Month
          description: 'Cron Days Of The Month to Run. Use "*" for "all". (Example:
            "1,15")'
          maxLength: 124
        month_of_year:
          type: string
          title: Month(s) Of The Year
          description: 'Cron Months (1-12) Of The Year to Run. Use "*" for "all".
            (Example: "1,12")'
          maxLength: 64
        display_name:
          type: string
          readOnly: true
    PatchedIntervalSchedule:
      type: object
      description: 'Serializer.


        Teaches the rest_framework (the ViewSet) which fields to expect.'
      properties:
        id:
          type: integer
          readOnly: true
        every:
          type: integer
          maximum: 2147483647
          minimum: 1
          title: Number of Periods
          description: Number of interval periods to wait before running the task
            again
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          title: Interval Period
          description: 'The type of period between task runs (Example: days)


            * `days` - Days

            * `hours` - Hours

            * `minutes` - Minutes

            * `seconds` - Seconds

            * `microseconds` - Microseconds'
        display_name:
          type: string
          readOnly: true
    PatchedPeriodicTask:
      type: object
      description: 'Serializes periodic tasks.


        Teaches the rest_framework (the ViewSet) which fields to expect.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Short Description For This Task
          maxLength: 200
        task:
          type: string
          title: Task Name
          description: 'The Name of the Celery Task that Should be Run.  (Example:
            "proj.tasks.import_contacts")'
          maxLength: 200
        args:
          type: string
          title: Positional Arguments
          description: 'JSON encoded positional arguments (Example: ["arg1", "arg2"])'
        kwargs:
          type: string
          title: Keyword Arguments
          description: 'JSON encoded keyword arguments (Example: {"argument": "value"})'
        queue:
          type:
          - string
          - 'null'
          title: Queue Override
          description: Queue defined in CELERY_TASK_QUEUES. Leave None for default
            queuing.
          maxLength: 200
        exchange:
          type:
          - string
          - 'null'
          description: Override Exchange for low-level AMQP routing
          maxLength: 200
        routing_key:
          type:
          - string
          - 'null'
          description: Override Routing Key for low-level AMQP routing
          maxLength: 200
        expires:
          type:
          - string
          - 'null'
          format: date-time
          title: Expires Datetime
          description: Datetime after which the schedule will no longer trigger the
            task to run
        enabled:
          type: boolean
          description: Set to False to disable the schedule
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          title: Last Run Datetime
          description: Datetime that the schedule last triggered the task to run.
            Reset to None if enabled is set to False.
        total_run_count:
          type: integer
          readOnly: true
          description: Running count of how many times the schedule has triggered
            the task
        date_changed:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified
          description: Datetime that this PeriodicTask was last modified
        description:
          type: string
          description: Detailed description about the details of this Periodic Task
        crontab_id:
          type:
          - integer
          - 'null'
          title: Crontab Schedule
          description: Crontab Schedule to run the task on.  Set only one schedule
            type, leave the others null.
          readOnly: true
        crontab:
          type: string
          format: uri
        interval_id:
          type:
          - integer
          - 'null'
          title: Interval Schedule
          description: Interval Schedule to run the task on.  Set only one schedule
            type, leave the others null.
          readOnly: true
        interval:
          type: string
          format: uri
        url:
          type: string
          format: uri
          readOnly: true
        display_name:
          type: string
          readOnly: true
        display_schedule:
          type:
          - string
          - 'null'
          readOnly: true
    PeriodEnum:
      enum:
      - days
      - hours
      - minutes
      - seconds
      - microseconds
      type: string
      description: '* `days` - Days

        * `hours` - Hours

        * `minutes` - Minutes

        * `seconds` - Seconds

        * `microseconds` - Microseconds'
    PeriodicTask:
      type: object
